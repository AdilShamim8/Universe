name: Weekly source scan (dry-run)

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Dry-run only: fixtures, zero network. Live scanning stays maintainer-
      # controlled (registries/sources/allowlist.yaml refresh.enabled) until
      # a human reviews a dry-run report. Scheduled workflows can be delayed
      # or disabled by GitHub; check the run history for actual freshness.
      - run: npm run ingest:dry-run
