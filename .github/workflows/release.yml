name: Release manifest

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic version (e.g. 0.1.1)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  manifest:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Manifest pins the exact commit.
          fetch-depth: 1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run validate
      - run: npm test
      - run: npm run build
      - name: Generate release manifest
        run: >
          npm run release:manifest --
          --version="${{ inputs.version }}"
          --test-summary="CI gates green (lint, typecheck, validate, test, build); e2e covered in ci.yml"
      - name: Commit manifest
        run: |
          git config user.name "release-bot"
          git config user.email "release-bot@users.noreply.github.com"
          git add release/manifests/
          git commit -m "chore(release): manifest ${{ inputs.version }}" || echo "no manifest changes"
          git push
